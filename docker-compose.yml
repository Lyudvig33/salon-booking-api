services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon
    ports:
      # 5433 on the host, so it doesn't clash with a locally installed PostgreSQL
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # -h localhost: the temporary server used during initialization has no TCP
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
